openapi: 3.0.3
info:
  title: 'Careflux API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1:8000'
tags:
  -
    name: 'Authenticated Customer'
    description: ''
  -
    name: 'Customer Authentication'
    description: ''
  -
    name: Endpoints
    description: ''
  -
    name: 'Pharmacy Endpoints'
    description: ''
paths:
  /api/v1/customer/profile:
    get:
      summary: 'Get Authenticated Patient Profile'
      operationId: getAuthenticatedPatientProfile
      description: 'Retrieves the complete patient profile for the currently authenticated user.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Authenticated Customer'
  /api/v1/customer/orders:
    get:
      summary: 'Get Authenticated Patient Order History'
      operationId: getAuthenticatedPatientOrderHistory
      description: "Retrieves a paginated list of the authenticated patient's past orders (invoices)."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Authenticated Customer'
  /api/v1/customer/register:
    post:
      summary: 'Register a new Patient account.'
      operationId: registerANewPatientAccount
      description: "Creates a new User and linked Patient profile. On success, it returns the user object\nand a Sanctum API token for authenticating subsequent requests."
      parameters: []
      responses: {  }
      tags:
        - 'Customer Authentication'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                  nullable: false
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: zbailey@example.net
                  nullable: false
                phone:
                  type: string
                  description: 'Must be at least 10 characters.'
                  example: iyvdljnikhwaykcmyuwpwlvqwrsitcpscqldzsnrwtu
                  nullable: false
                password:
                  type: string
                  description: 'Must be at least 8 characters.'
                  example: "'ff2dSF'8nSGnI)Tx:"
                  nullable: false
              required:
                - name
                - email
                - phone
                - password
      security: []
  /api/v1/customer/login:
    post:
      summary: 'Log in a Patient.'
      operationId: logInAPatient
      description: "Authenticates a user with their email and password. On success, it returns the user object\nand a new Sanctum API token."
      parameters: []
      responses: {  }
      tags:
        - 'Customer Authentication'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                  nullable: false
                password:
                  type: string
                  description: ''
                  example: architecto
                  nullable: false
              required:
                - email
                - password
      security: []
  /api/v1/customer/logout:
    post:
      summary: 'Log out a Patient.'
      operationId: logOutAPatient
      description: 'Revokes the currently used Sanctum API token.'
      parameters: []
      responses: {  }
      tags:
        - 'Customer Authentication'
  /api/v1/medications:
    get:
      summary: 'Display a listing of the resource.'
      operationId: displayAListingOfTheResource
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data: []
                  links:
                    first: 'http://127.0.0.1:8000/api/v1/medications?page=1'
                    last: 'http://127.0.0.1:8000/api/v1/medications?page=1'
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    from: null
                    last_page: 1
                    links:
                      -
                        url: null
                        label: '&laquo; Previous'
                        page: null
                        active: false
                      -
                        url: 'http://127.0.0.1:8000/api/v1/medications?page=1'
                        label: '1'
                        page: 1
                        active: true
                      -
                        url: null
                        label: 'Next &raquo;'
                        page: null
                        active: false
                    path: 'http://127.0.0.1:8000/api/v1/medications'
                    per_page: 100
                    to: null
                    total: 0
                properties:
                  data:
                    type: array
                    example: []
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: 'http://127.0.0.1:8000/api/v1/medications?page=1'
                      last:
                        type: string
                        example: 'http://127.0.0.1:8000/api/v1/medications?page=1'
                      prev:
                        type: string
                        example: null
                      next:
                        type: string
                        example: null
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: string
                        example: null
                      last_page:
                        type: integer
                        example: 1
                      links:
                        type: array
                        example:
                          -
                            url: null
                            label: '&laquo; Previous'
                            page: null
                            active: false
                          -
                            url: 'http://127.0.0.1:8000/api/v1/medications?page=1'
                            label: '1'
                            page: 1
                            active: true
                          -
                            url: null
                            label: 'Next &raquo;'
                            page: null
                            active: false
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              example: null
                            label:
                              type: string
                              example: '&laquo; Previous'
                            page:
                              type: string
                              example: null
                            active:
                              type: boolean
                              example: false
                      path:
                        type: string
                        example: 'http://127.0.0.1:8000/api/v1/medications'
                      per_page:
                        type: integer
                        example: 100
                      to:
                        type: string
                        example: null
                      total:
                        type: integer
                        example: 0
      tags:
        - Endpoints
      security: []
  '/api/v1/medications/{id}':
    get:
      summary: 'Display the specified resource.'
      operationId: displayTheSpecifiedResource
      description: ''
      parameters: []
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No query results for model [Src\Medication\Domain\Models\Medication] 16'
                properties:
                  message:
                    type: string
                    example: 'No query results for model [Src\Medication\Domain\Models\Medication] 16'
      tags:
        - Endpoints
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the medication.'
        example: 16
        required: true
        schema:
          type: integer
  /api/v1/pharmacy-products:
    get:
      summary: ''
      operationId: getApiV1PharmacyProducts
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data: []
                  links:
                    first: 'http://127.0.0.1:8000/api/v1/pharmacy-products?page=1'
                    last: 'http://127.0.0.1:8000/api/v1/pharmacy-products?page=1'
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    from: null
                    last_page: 1
                    links:
                      -
                        url: null
                        label: '&laquo; Previous'
                        page: null
                        active: false
                      -
                        url: 'http://127.0.0.1:8000/api/v1/pharmacy-products?page=1'
                        label: '1'
                        page: 1
                        active: true
                      -
                        url: null
                        label: 'Next &raquo;'
                        page: null
                        active: false
                    path: 'http://127.0.0.1:8000/api/v1/pharmacy-products'
                    per_page: 100
                    to: null
                    total: 0
                properties:
                  data:
                    type: array
                    example: []
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: 'http://127.0.0.1:8000/api/v1/pharmacy-products?page=1'
                      last:
                        type: string
                        example: 'http://127.0.0.1:8000/api/v1/pharmacy-products?page=1'
                      prev:
                        type: string
                        example: null
                      next:
                        type: string
                        example: null
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: string
                        example: null
                      last_page:
                        type: integer
                        example: 1
                      links:
                        type: array
                        example:
                          -
                            url: null
                            label: '&laquo; Previous'
                            page: null
                            active: false
                          -
                            url: 'http://127.0.0.1:8000/api/v1/pharmacy-products?page=1'
                            label: '1'
                            page: 1
                            active: true
                          -
                            url: null
                            label: 'Next &raquo;'
                            page: null
                            active: false
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              example: null
                            label:
                              type: string
                              example: '&laquo; Previous'
                            page:
                              type: string
                              example: null
                            active:
                              type: boolean
                              example: false
                      path:
                        type: string
                        example: 'http://127.0.0.1:8000/api/v1/pharmacy-products'
                      per_page:
                        type: integer
                        example: 100
                      to:
                        type: string
                        example: null
                      total:
                        type: integer
                        example: 0
      tags:
        - Endpoints
      security: []
  '/api/v1/pharmacy-products/{slug}':
    get:
      summary: ''
      operationId: getApiV1PharmacyProductsSlug
      description: ''
      parameters: []
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No query results for model [Src\Pharmacy\Domain\Models\PharmacyProduct] architecto'
                properties:
                  message:
                    type: string
                    example: 'No query results for model [Src\Pharmacy\Domain\Models\PharmacyProduct] architecto'
      tags:
        - Endpoints
      security: []
    parameters:
      -
        in: path
        name: slug
        description: 'The slug of the pharmacy product.'
        example: architecto
        required: true
        schema:
          type: string
  /api/v1/orders:
    post:
      summary: 'Creates a new order from a storefront API request.'
      operationId: createsANewOrderFromAStorefrontAPIRequest
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      security: []
  /api/v1/storefront/settings:
    get:
      summary: 'Handle the incoming request.'
      operationId: handleTheIncomingRequest
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
      security: []
  '/api/v1/pharmacies/{id}':
    get:
      summary: 'Get Public Pharmacy Details'
      operationId: getPublicPharmacyDetails
      description: "Retrieve the public-facing details for a single approved pharmacy.\nThis endpoint is used by storefronts to display their \"About Us\" or contact information."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Medplus Pharmacy - Lekki Phase 1'
                    address: '123 Admiralty Way, Lekki'
                    phone: '08012345671'
                    logoUrl: null
                    location:
                      city: null
                      state: null
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Medplus Pharmacy - Lekki Phase 1'
                      address:
                        type: string
                        example: '123 Admiralty Way, Lekki'
                      phone:
                        type: string
                        example: '08012345671'
                      logoUrl:
                        type: string
                        example: null
                      location:
                        type: object
                        properties:
                          city:
                            type: string
                            example: null
                          state:
                            type: string
                            example: null
      tags:
        - 'Pharmacy Endpoints'
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the pharmacy.'
        example: 1
        required: true
        schema:
          type: integer
